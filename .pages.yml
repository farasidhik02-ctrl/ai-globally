media:
  - name: article_images
    label: Article Images
    input: assets/images
    output: /assets/images
    extensions:
      - webp
      - jpg
      - jpeg
      - png
    rename: safe

  - name: author_images
    label: Author Images
    input: assets/authors
    output: /assets/authors
    extensions:
      - webp
      - jpg
      - jpeg
      - png
    rename: safe


content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: yaml-frontmatter

    view:
      primary: title
      fields:
        - title
        - type
        - category
        - date
        - author
      sort: date
      order: desc

    fields:
      - name: title
        label: Headline
        type: string
        required: true

      - name: type
        label: Content Type
        type: select
        required: true
        options:
          values:
            - News
            - Insight
            - Explainer

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Innovation
            - Policy
            - Business
            - Infrastructure
            - People

      - name: author
        label: Author
        type: string
        default: Fara Sidhik
        required: true

      - name: author_image
        label: Author Image
        type: image
        options:
          media: author_images

      - name: tags
        label: Tags
        type: select
        options:
          multiple: true
          values:

