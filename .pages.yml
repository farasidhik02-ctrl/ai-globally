      - name: date
        label: Publish Date
        type: date
        required: true

      - name: time
        label: Publish Time
        type: string
        description: Use 24-hour format, for example 14:30

      - name: home_image
        label: Popular News Image
        type: image
        options:
          media: article_images
        description: Used only for the Popular News card on the homepage. It will not appear at the top of the article.

      - name: home_image_alt
        label: Popular News Image Alt Text
        type: string
        description: Describe the Popular News image for accessibility and search engines.

      - name: featured_home
        label: Show in Popular News
        type: select
        required: true
        options:
          values:
            - value: true
              label: Yes
            - value: false
              label: No

      - name: key_point_1
        label: Key Point 1
        type: string

      - name: key_point_2
        label: Key Point 2
        type: string

      - name: key_point_3
        label: Key Point 3
        type: string

      - name: seo_title
        label: SEO Title
        type: string

      - name: meta_description
        label: Meta Description
        type: text

      - name: body
        label: Article Body
        type: rich-text
        required: true
        options:
          format: markdown
          media: article_images
          switcher: true