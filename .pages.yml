media:
  - name: article_images
    label: Article Images
    input: assets/images
    output: /assets/images
    extensions:
      - webp
      - jpg
      - jpeg
      - png
    rename: safe

content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: yaml-frontmatter

    view:
      primary: title
      sort: date
      order: desc

    fields:
      - name: title
        label: Headline
        type: string
        required: true

      - name: type
        label: Content Type
        type: select
        required: true
        options:
          values:
            - News
            - Insight
            - Explainer

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Innovation
            - Policy
            - Business
            - Infrastructure
            - People

      - name: author
        label: Author
        type: string
        required: true

      - name: date
        label: Publish Date
        type: date
        required: true

      - name: image
        label: Featured Image
        type: image
        options:
          media: article_images

      - name: image_alt
        label: Image Alt Text
        type: string

      - name: key_point_1
        label: Key Point 1
        type: string

      - name: key_point_2
        label: Key Point 2
        type: string

      - name: key_point_3
        label: Key Point 3
        type: string

      - name: seo_title
        label: SEO Title
        type: string

      - name: meta_description
        label: Meta Description
        type: text

      - name: body
        label: Article Body
        type: rich-text
        required: true
        options:
          format: markdown
          media: article_images
          switcher: true